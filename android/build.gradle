group 'com.jiguang.jpush'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
    }
}

rootProject.allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.jiguang.jpush"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = 21
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    // TODO: 同步官方最新代码, 为什么fork了一份? 考虑直接使用官方依赖
    implementation 'cn.jiguang.sdk:jpush-google:6.3.1'
    implementation 'cn.jiguang.sdk:jcore-google:5.6.0'
}